<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DXF Mesh Contour Demo — Center Load</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1220;
        color: #e8eefc;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hud {
        position: absolute;
        left: 16px;
        top: 16px;
        right: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: flex-start;
        pointer-events: none;
      }
      .card {
        background: rgba(12, 20, 36, 0.82);
        border: 1px solid rgba(140, 170, 220, 0.25);
        border-radius: 10px;
        padding: 12px 14px;
        max-width: 360px;
        backdrop-filter: blur(6px);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 650;
      }
      p,
      li {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
        color: #b7c5e0;
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .bar {
        height: 12px;
        width: 140px;
        border-radius: 999px;
        background: linear-gradient(90deg, #1d4ed8, #22c55e, #eab308, #ef4444);
      }
      .controls {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 220px;
      }
      label {
        font-size: 12px;
        color: #b7c5e0;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      input[type="range"] {
        width: 100%;
      }
      .hint {
        position: absolute;
        bottom: 14px;
        left: 16px;
        font-size: 12px;
        color: #8fa3c8;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="card">
        <h1>DXF surface mesh + center load zones</h1>
        <p>
          Real triangles from <code>_1 Geniox 10.dxf</code>. Colors are a screening contour from an
          extra center weight (red = high effect near load, blue = low farther away) — not a full FEA
          solve.
        </p>
        <div class="legend">
          <span>Low</span>
          <div class="bar"></div>
          <span>High</span>
        </div>
      </div>
      <div class="card controls">
        <label
          >Center load
          <strong id="loadLabel">5000 N</strong>
        </label>
        <input id="load" type="range" min="500" max="20000" step="100" value="5000" />
        <label
          >Wireframe opacity
          <strong id="wireLabel">0.35</strong>
        </label>
        <input id="wire" type="range" min="0" max="1" step="0.05" value="0.35" />
        <p id="stats">Loading mesh…</p>
      </div>
    </div>
    <div class="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
    <canvas id="c"></canvas>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three"
      import { OrbitControls } from "three/addons/controls/OrbitControls.js"

      const canvas = document.getElementById("c")
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
      renderer.setClearColor(0x0b1220, 1)

      const scene = new THREE.Scene()
      const camera = new THREE.PerspectiveCamera(45, 1, 1, 20000)
      const controls = new OrbitControls(camera, canvas)
      controls.enableDamping = true

      scene.add(new THREE.AmbientLight(0xffffff, 0.55))
      const key = new THREE.DirectionalLight(0xffffff, 0.9)
      key.position.set(2, 3, 4)
      scene.add(key)

      const meshGroup = new THREE.Group()
      scene.add(meshGroup)

      // Center load marker (arrow-ish)
      const loadMarker = new THREE.Group()
      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(12, 12, 180, 12),
        new THREE.MeshBasicMaterial({ color: 0xff3344 })
      )
      shaft.position.y = 200
      const head = new THREE.Mesh(
        new THREE.ConeGeometry(36, 70, 16),
        new THREE.MeshBasicMaterial({ color: 0xff3344 })
      )
      head.position.y = 85
      head.rotation.x = Math.PI
      loadMarker.add(shaft, head)
      scene.add(loadMarker)

      let solidMesh = null
      let wireMesh = null
      let positions = null
      let colors = null
      let bounds = null

      function heatColor(t, target) {
        // blue -> cyan -> green -> yellow -> red
        const stops = [
          [0.0, [29, 78, 216]],
          [0.35, [34, 197, 94]],
          [0.65, [234, 179, 8]],
          [1.0, [239, 68, 68]],
        ]
        let i = 0
        while (i < stops.length - 2 && t > stops[i + 1][0]) i++
        const a = stops[i]
        const b = stops[i + 1]
        const u = (t - a[0]) / (b[0] - a[0] || 1)
        target[0] = (a[1][0] + (b[1][0] - a[1][0]) * u) / 255
        target[1] = (a[1][1] + (b[1][1] - a[1][1]) * u) / 255
        target[2] = (a[1][2] + (b[1][2] - a[1][2]) * u) / 255
      }

      function applyContour(loadN) {
        if (!positions || !colors || !bounds) return
        const cx = (bounds.minX + bounds.maxX) / 2
        const cy = (bounds.minY + bounds.maxY) / 2
        const halfLen = Math.max((bounds.maxX - bounds.minX) / 2, 1)
        // Intensity grows with load; map to 0..1 with soft falloff from center
        const gain = Math.min(1.4, 0.35 + loadN / 12000)
        const tmp = [0, 0, 0]
        for (let i = 0, c = 0; i < positions.length; i += 3, c += 3) {
          const x = positions[i]
          const y = positions[i + 1]
          const dx = (x - cx) / halfLen
          const dy = (y - cy) / ((bounds.maxY - bounds.minY) / 2 || 1)
          // Beam-like: highest under center load, decays toward ends
          const radial = Math.sqrt(dx * dx * 1.0 + dy * dy * 0.25)
          let t = Math.exp(-2.2 * radial * radial) * gain
          t = Math.min(1, Math.max(0, t))
          heatColor(t, tmp)
          colors[c] = tmp[0]
          colors[c + 1] = tmp[1]
          colors[c + 2] = tmp[2]
        }
        solidMesh.geometry.attributes.color.needsUpdate = true
        document.getElementById("loadLabel").textContent = `${loadN} N`
      }

      function resize() {
        const w = window.innerWidth
        const h = window.innerHeight
        renderer.setSize(w, h, false)
        camera.aspect = w / h
        camera.updateProjectionMatrix()
      }
      window.addEventListener("resize", resize)
      resize()

      const meshData = await fetch("./mesh.json").then((r) => r.json())
      positions = new Float32Array(meshData.positions)
      bounds = meshData.bounds
      colors = new Float32Array(positions.length)

      const geo = new THREE.BufferGeometry()
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3))
      geo.setAttribute("color", new THREE.BufferAttribute(colors, 3))
      geo.computeVertexNormals()

      solidMesh = new THREE.Mesh(
        geo,
        new THREE.MeshLambertMaterial({
          vertexColors: true,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.92,
        })
      )
      wireMesh = new THREE.Mesh(
        geo,
        new THREE.MeshBasicMaterial({
          color: 0xdbeafe,
          wireframe: true,
          transparent: true,
          opacity: 0.35,
        })
      )
      meshGroup.add(solidMesh, wireMesh)

      // DXF Z is up → rotate into Three.js Y-up
      const cx = (bounds.minX + bounds.maxX) / 2
      const cy = (bounds.minY + bounds.maxY) / 2
      const cz = (bounds.minZ + bounds.maxZ) / 2
      meshGroup.rotation.x = -Math.PI / 2
      meshGroup.position.set(-cx, cz, cy)
      // After rotation, unit height is along world Y
      const height = bounds.maxZ - bounds.minZ
      loadMarker.position.set(0, height / 2 + 80, 0)

      const sizeX = bounds.maxX - bounds.minX
      const sizeY = bounds.maxY - bounds.minY
      const sizeZ = bounds.maxZ - bounds.minZ
      const maxDim = Math.max(sizeX, sizeY, sizeZ)
      camera.position.set(maxDim * 0.95, maxDim * 0.45, maxDim * 0.95)
      controls.target.set(0, 0, 0)

      document.getElementById("stats").textContent =
        `${meshData.triangleCount.toLocaleString()} triangles · ${sizeX.toFixed(0)}×${sizeY.toFixed(0)}×${sizeZ.toFixed(0)} mm`

      const loadInput = document.getElementById("load")
      const wireInput = document.getElementById("wire")
      applyContour(Number(loadInput.value))
      loadInput.addEventListener("input", () => applyContour(Number(loadInput.value)))
      wireInput.addEventListener("input", () => {
        const v = Number(wireInput.value)
        wireMesh.material.opacity = v
        document.getElementById("wireLabel").textContent = v.toFixed(2)
      })

      function tick() {
        controls.update()
        renderer.render(scene, camera)
        requestAnimationFrame(tick)
      }
      tick()
    </script>
  </body>
</html>
